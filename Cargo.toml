[package]
name = "meta-signal-ethos-zero"
version = "2.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-ethos-zero"
description = "Generation-zero MetaSignal contract for Ethos."
publish = false
build = "build.rs"

[lib]
name = "meta_signal_ethos_zero"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-ethos-zero/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "2b94a00", default-features = false }
signal-ethos-zero = { git = "https://github.com/LiGoldragon/signal-ethos-zero", rev = "a451497" }

[build-dependencies]
signal-ethos-zero = { git = "https://github.com/LiGoldragon/signal-ethos-zero", rev = "a451497" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c0d9f6b" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"


[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c0d9f6b" }
